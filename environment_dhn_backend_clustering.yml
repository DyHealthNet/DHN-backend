name: dhn-backend2
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.11
  # hsbm community detection (network/views/metagraph.py, _run_hsbm_clustering) --
  # graph-tool has no pip wheel, conda-forge only. IMPORTANT: install this conda
  # package FIRST, then the pip block below LAST -- conda-forge's graph-tool pulls
  # in its own numpy/scipy build that silently overwrites the pip-pinned versions
  # on disk (conda and pip don't share install records), which breaks numba/
  # numba-scipy's hard pin. Installing pip last makes pip's numpy==1.26.4/
  # scipy==1.11.0 win. If you ever `conda install`/`conda update` anything into
  # this env afterward, re-run `pip install --force-reinstall --no-deps
  # numpy==1.26.4 scipy==1.11.0` immediately after, and restart any running
  # `manage.py runserver` (its autoreloader can catch numpy mid-reinstall and crash).
  - conda-forge::graph-tool
  - pip
  - pip:
      - Django==5.0.4
      - django_environ==0.11.2
      - djangorestframework==3.15.2
      - django-extensions==3.2.3
      - django-allauth==65.2.0
      - django-cors-headers==4.4.0
      - django-redis==5.4.0
      - drf_spectacular==0.27.2
      - matplotlib==3.8.4
      - pyarrow==18.1.0
      - seaborn==0.13.2
      - celery==5.4.0
      - psycopg2-binary==2.9.9
      - requests==2.31.0
      - jwt==1.3.1
      # Pinned exactly to satisfy napypi's own requirements (numpy==1.26.*, scipy==1.11.0,
      # numba==0.60.0, numba-scipy==0.4.0) - a version mismatch here is what broke earlier
      # environment attempts (numpy got bumped past what numba supports).
      - numpy==1.26.4
      - scipy==1.11.0
      - numba==0.60.0
      - numba-scipy==0.4.0
      - pandas==2.2.3
      # bumped from 3.4.2 to satisfy moDiNA's networkx>=3.5 requirement
      - networkx==3.5
      # modina (network.utils.data_manager.combine_data / compute_association_scores_new) stack
      - napypi==1.1.7
      - python-igraph==1.0.0
      - torch
      # metagraph community detection (network/views/metagraph.py)
      - leidenalg==0.12.0
      - scikit-learn
# moDiNA itself isn't on PyPI - after creating this env, install it from your local checkout:
#   pip install -e /path/to/moDiNA --no-deps
