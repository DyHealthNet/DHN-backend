# DIGEST (gene/disease-set enrichment scoring for community-detection clusterings, see
# network/views/biodigest_scoring.py), self-hosted from the upstream image -- not built
# here. Separate stack/compose file from docker-compose.yml since it's an independent service with
# its own db/broker; the Django backend talks to it over HTTP (DIGEST_API_BASE_URL).
#
# Usage: docker compose -f docker-compose.digest.yml up -d
#   (requires digest_django.env -- copy digest_django.env.example and fill in secrets first)
services:
  digest_db:
    image: postgres:15
    container_name: digest_db
    hostname: digest_db
    restart: unless-stopped
    env_file:
      - digest_django.env
    volumes:
      - digest_db_volume:/var/lib/postgresql/data

  digest_redis:
    image: redis
    container_name: digest_redis
    hostname: digest_redis
    restart: unless-stopped
    depends_on:
      - digest_db

  digest_backend:
    image: ghcr.io/bionetslab/digest-api:main
    container_name: digest_backend
    restart: unless-stopped
    command: ["sh", "/usr/src/digest/docker-entrypoint.sh"]
    env_file:
      - digest_django.env
    volumes:
      - digest_volume:/usr/src/digest/mapping_files
    # bound to localhost only: digest-api has no auth of its own (see backend service in
    # docker-compose.yml for the same reasoning), so it must never be reachable from outside
    # the host. The Django backend reaches it via DIGEST_API_BASE_URL=http://localhost:8072.
    ports:
      - "127.0.0.1:8072:8000"
    depends_on:
      - digest_db
      - digest_redis

  digest_celery:
    image: ghcr.io/bionetslab/digest-api:main
    container_name: digest_celery
    hostname: digest_celery
    restart: unless-stopped
    command: ["sh", "/usr/src/digest/scripts/start_celery_worker.sh"]
    env_file:
      - digest_django.env
    volumes:
      - digest_volume:/usr/src/digest/mapping_files
    depends_on:
      - digest_db
      - digest_redis

  digest_celery_beat:
    image: ghcr.io/bionetslab/digest-api:main
    container_name: digest_celery_beat
    hostname: digest_celery_beat
    restart: unless-stopped
    command: ["sh", "/usr/src/digest/scripts/start_celery_beat.sh"]
    env_file:
      - digest_django.env
    volumes:
      - digest_volume:/usr/src/digest/mapping_files
    depends_on:
      - digest_db
      - digest_redis

volumes:
  digest_db_volume:
  digest_volume:
